# Check that a pull request's docs still build: the HTML without warnings, and the PDFs.
# Nothing is published.

name: "Pull Request Docs Check"
on:
  pull_request:
    branches:
      - main
    paths:
      - docs/source/**
      - tools/**
      - .github/workflows/**

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The published site, so only the PDFs this pull request changes are rendered.
    - name: Check out docs-build
      uses: actions/checkout@v4
      with:
        ref: docs-build
        path: site

    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: docs/source/requirements.txt

    - name: Install Requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
        pip install -r docs/source/requirements.txt

    # -W fails the check on any Sphinx warning; --keep-going lists all of them first.
    - name: Build HTML
      run: |
        sphinx-build -b html docs/source build/html -d build/doctrees -E -a -j auto -W --keep-going

    - name: Build PDFs
      run: |
        python tools/build_pdfs.py build/html --previous site
