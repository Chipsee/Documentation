# Build the HTML and PDF manuals on the main branch and publish them to the docs-build branch,
# which the website pulls to serve chipsee.com/docs.

name: Build docs and update docs-build branch

on:
  push:
    branches:
      - main
    paths:
      - docs/source/**
      - tools/build_pdfs.py
      - .github/workflows/main.yml

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      all_pdfs:
        description: Render every PDF, even unchanged ones
        type: boolean
        default: false

# One build at a time, so each one publishes on top of the last.
concurrency:
  group: docs-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The published site, whose unchanged PDFs are reused instead of rendered again.
    - name: Check out docs-build
      uses: actions/checkout@v4
      with:
        ref: docs-build
        path: site

    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: docs/source/requirements.txt

    - name: Install Requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
        pip install -r docs/source/requirements.txt

    - name: Build HTML
      run: |
        sphinx-build -b html docs/source build/html -d build/doctrees -E -a -j auto

    - name: Build PDFs
      run: |
        python tools/build_pdfs.py build/html --previous site ${{ inputs.all_pdfs && '--force' || '' }}

    # Replace the branch's files with the new build, so removed pages and PDFs go away too.
    - name: Publish to docs-build
      run: |
        touch build/html/.nojekyll
        cd site
        git rm -rq .
        cp -a ../build/html/. .
        git add -A
        git config user.name "github-actions[bot]"
        git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
        if git diff --cached --quiet; then
          echo "Nothing changed"
        else
          git commit -q -m "Add changes for ${GITHUB_SHA}"
          git push origin docs-build
        fi
