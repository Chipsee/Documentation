{# Import the theme's layout. #}
{% extends '!layout.html' %}

{%- block font %}
    <link href="{{ pathto('_static/vendor/bootstrap/5.3.2/css/bootstrap.min.css', 1) }}" rel="stylesheet">
{%- endblock %}

{%- block extrahead %}
    {{ super() }}
    <meta name="description" content="Hardware and software manuals for Chipsee industrial panel PCs, embedded computers, displays and kiosks.">
    <meta property="og:title" content="{{ title|striptags|e }}">
    <meta property="og:description" content="Hardware and software manuals for Chipsee industrial panel PCs, embedded computers, displays and kiosks.">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Chipsee Documentation">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="https://chipsee.com/docs/_static/images/og-chipsee-docs.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    {%- if pageurl %}
    <meta property="og:url" content="{{ pageurl|e }}">
    {%- endif %}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ title|striptags|e }}">
    <meta name="twitter:description" content="Hardware and software manuals for Chipsee industrial panel PCs, embedded computers, displays and kiosks.">
    <meta name="twitter:image" content="https://chipsee.com/docs/_static/images/og-chipsee-docs.png">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://chipsee.com/#organization",
      "name": "Chipsee",
      "url": "https://chipsee.com/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://chipsee.com/docs/_static/images/logo_header.png",
        "width": 300,
        "height": 62
      },
      "sameAs": [
        "https://www.linkedin.com/company/chipsee",
        "https://twitter.com/ChipseeIPC",
        "https://www.facebook.com/chipseeIPC",
        "https://www.youtube.com/channel/UCLq5xGP_6Sbw5e0WzUlUgYQ"
      ]
    }
    </script>
    {%- if breadcrumb_items %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "@id": {{ (pageurl ~ "#breadcrumb")|tojson }},
      "itemListElement": [
        {%- for item in breadcrumb_items %}
        {
          "@type": "ListItem",
          "position": {{ loop.index }},
          "name": {{ item.name|striptags|tojson }}{% if item.url %},
          "item": {{ item.url|tojson }}{% endif %}
        }{% if not loop.last %},{% endif %}
        {%- endfor %}
      ]
    }
    </script>
    {%- endif %}

    <script async src="{{ pathto('_static/vendor/es-module-shims/1.8.0/es-module-shims.js', 1) }}"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "{{ pathto('_static/vendor/three/0.155/build/three.module.js', 1) }}",
          "three/addons/": "{{ pathto('_static/vendor/three/0.155/examples/jsm/', 1) }}"
        }
      }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MP6B40CSCF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-MP6B40CSCF');
    </script>
    <!-- Ends Google tag (gtag.js) -->
{% endblock %}


{%- block footer_scripts %}
    <script src="{{ pathto('_static/vendor/bootstrap/5.3.2/js/bootstrap.bundle.min.js', 1) }}"></script>
    <script async src="{{ pathto('_static/js/material_custom.js', 1) }}"></script>

    {{ super() }}
{%- endblock %}
