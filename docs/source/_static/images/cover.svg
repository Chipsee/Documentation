<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <defs>
    <linearGradient id="navyFade" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0" stop-color="#2d445e" stop-opacity=".24"/>
      <stop offset=".6" stop-color="#6b7385" stop-opacity=".1"/>
      <stop offset="1" stop-color="#6b7385" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slateFade" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0" stop-color="#6b7385" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6b7385" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lightFade" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0" stop-color="#dde0e6" stop-opacity=".65"/>
      <stop offset="1" stop-color="#dde0e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0" stop-color="#2d445e" stop-opacity=".2"/>
      <stop offset="1" stop-color="#6b7385" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="210" height="297" fill="#fff"/>

  <!-- Upper geometric field -->
  <polygon points="191,-31 233,11 191,53 149,11" fill="url(#navyFade)"/>
  <polygon points="209,13 246,50 209,87 172,50" fill="url(#lightFade)"/>
  <polygon points="180,10 202,32 180,54 158,32"
           fill="none" stroke="#6b7385" stroke-width=".3" stroke-opacity=".25"/>
  <polygon points="203,-7 232,22 203,51 174,22"
           fill="none" stroke="#2d445e" stroke-width=".3" stroke-opacity=".18"/>
  <polygon points="148,35 159,46 148,57 137,46"
           fill="#dde0e6" fill-opacity=".07"/>
  <polygon points="170,53 175,58 170,63 165,58"
           fill="#6b7385" fill-opacity=".14"/>

  <!-- Main right-edge diamonds -->
  <polygon points="199,60 237,98 199,136 161,98" fill="url(#navyFade)"/>
  <polygon points="210,89 235,114 210,139 185,114"
           fill="none" stroke="#2d445e" stroke-width=".3" stroke-opacity=".24"/>
  <polygon points="184,77 200,93 184,109 168,93"
           fill="none" stroke="#6b7385" stroke-width=".3" stroke-opacity=".22"/>
  <polygon points="207,126 256,175 207,224 158,175" fill="url(#slateFade)"/>
  <polygon points="204,143 236,175 204,207 172,175"
           fill="none" stroke="#6b7385" stroke-width=".3" stroke-opacity=".27"/>
  <polygon points="190,166 207,183 190,200 173,183" fill="url(#lightFade)"/>
  <polygon points="203,203 225,225 203,247 181,225"
           fill="none" stroke="#2d445e" stroke-width=".3" stroke-opacity=".18"/>

  <!-- Lower geometric field -->
  <polygon points="213,225 262,274 213,323 164,274" fill="url(#bottomFade)"/>
  <polygon points="184,236 212,264 184,292 156,264"
           fill="none" stroke="#6b7385" stroke-width=".3" stroke-opacity=".25"/>
  <polygon points="205,266 235,296 205,326 175,296" fill="url(#lightFade)"/>
  <polygon points="151,222 161,232 151,242 141,232"
           fill="#6b7385" fill-opacity=".065"/>
  <polygon points="133,224 140,231 133,238 126,231"
           fill="none" stroke="#6b7385" stroke-width=".3" stroke-opacity=".07"/>
  <polygon points="171,282 178,289 171,296 164,289"
           fill="#dde0e6" fill-opacity=".4"/>

  <!-- Fine data-flow traces -->
  <line x1="199" y1="0" x2="199" y2="45"
        stroke="#2d445e" stroke-width=".3" stroke-opacity=".23"/>
  <path d="M197.7 42.8 199 45 200.3 42.8"
        fill="none" stroke="#2d445e" stroke-width=".3" stroke-opacity=".35"/>
  <line x1="188" y1="39" x2="188" y2="72"
        stroke="#6b7385" stroke-width=".3" stroke-opacity=".26"/>
  <path d="M186.7 69.8 188 72 189.3 69.8"
        fill="none" stroke="#6b7385" stroke-width=".3" stroke-opacity=".35"/>
  <line x1="204" y1="116" x2="204" y2="158"
        stroke="#2d445e" stroke-width=".3" stroke-opacity=".23"/>
  <path d="M202.7 155.8 204 158 205.3 155.8"
        fill="none" stroke="#2d445e" stroke-width=".3" stroke-opacity=".35"/>
  <line x1="166" y1="135" x2="166" y2="161"
        stroke="#6b7385" stroke-width=".3" stroke-opacity=".2"/>
  <path d="M164.7 158.8 166 161 167.3 158.8"
        fill="none" stroke="#6b7385" stroke-width=".3" stroke-opacity=".3"/>
  <line x1="194" y1="211" x2="194" y2="251"
        stroke="#2d445e" stroke-width=".3" stroke-opacity=".24"/>
  <path d="M192.7 248.8 194 251 195.3 248.8"
        fill="none" stroke="#2d445e" stroke-width=".3" stroke-opacity=".35"/>
  <line x1="203" y1="270" x2="203" y2="297"
        stroke="#6b7385" stroke-width=".3" stroke-opacity=".25"/>

  <!-- Restrained brand accents -->
  <polygon points="188,55 190,57 188,59 186,57" fill="#ef3d30"/>
  <line x1="194" y1="230" x2="194" y2="236"
        stroke="#ef3d30" stroke-width=".6"/>
</svg>
